name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Guards the manual release flow: a v-tag must match manifest.json's
      # version, or HACS ships a mismatched release.
      - name: Tag matches manifest version
        run: |
          MANIFEST=$(jq -r .version custom_components/meshcore/manifest.json)
          TAG="${GITHUB_REF_NAME#v}"
          echo "manifest=$MANIFEST tag=$TAG"
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "::error::tag $TAG does not match manifest version $MANIFEST"
            exit 1
          fi
      - name: HACS installable schema floor
        run: python scripts/check_hacs_installable_schema.py
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
