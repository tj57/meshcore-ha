# Ready-to-use automations for mesh node requests
#
# Prerequisites:
#   MeshCore → Configure → Global Settings → Enable mesh node requests
#   Install mcrpc Python package in the HA environment

alias: Mesh ping tracker
description: Ping a node and notify on success
triggers: []
conditions: []
actions:
  - action: meshcore.request
    data:
      target: tracker
      command: ping
      timeout: 10
    response_variable: ping
  - condition: template
    value_template: "{{ ping.success }}"
  - action: persistent_notification.create
    data:
      title: Mesh ping OK
      message: "tracker replied (latency {{ ping.latency_ms }} ms)"
mode: single
